<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swiftec Security Center</title>
<link rel="icon" type="image/png" href="/assets/logo-64.png">
<link rel="apple-touch-icon" href="/assets/logo-180.png">
<style>:root{color-scheme:light dark;--bg:#fff;--card:#fff;--fg:#1E2A3C;--mut:#616E82;--bd:#E5E7EB;--pri:#3188FF;--pri-soft:#E9F0FF;--crit:#ff3b30;--high:#ff9500;--med:#d99a00;--low:#3188FF;--info:#8e8e93;--ok:#1f9d55;--ok-soft:#E7F7EF;--code:#F3F4F6;--glass:rgba(255,255,255,.82);--shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(49,136,255,.10);--ease:cubic-bezier(.32,.72,0,1)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#141a26;--fg:#f2f5fa;--mut:#9aa6b8;--bd:#263042;--pri:#3188FF;--pri-soft:#16294a;--crit:#ff6b60;--high:#ff9f0a;--med:#ffd60a;--low:#6aa9ff;--info:#8e8e93;--ok:#34c77b;--ok-soft:#10301f;--code:rgba(120,140,170,.16);--glass:rgba(20,26,38,.78);--shadow:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s}
body{background:linear-gradient(135deg,#C9DEFF 0%,#E6F0FF 35%,#D5E6FF 70%,#EEF5FF 100%) fixed;min-height:100vh}
@media(prefers-color-scheme:dark){body{background:linear-gradient(135deg,#0d1b33,#0b0f17 60%,#10203b) fixed}}
h1,h2{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;letter-spacing:-.022em}
.wrap{max-width:1760px;margin:0 auto;padding:22px clamp(16px,3vw,48px) 60px}
.top{position:sticky;top:0;z-index:4;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--bd)}
.top>div{max-width:1760px;margin:0 auto;padding:10px clamp(16px,3vw,48px);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;vertical-align:middle;margin-right:10px;box-shadow:0 1px 4px rgba(49,136,255,.35)}
.tagline{letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600;color:var(--pri)}
.brand{display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
h3{margin:18px 0 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut)}.mono,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
button{font:inherit;font-weight:500;border:0;background:var(--code);color:var(--fg);padding:7px 16px;border-radius:980px;cursor:pointer;transition:transform .1s ease-out,filter .2s,background .2s}
button:hover{filter:brightness(.96)}button:active{transform:scale(.97)}
button.pri{background:var(--pri);color:#fff}button.pri:hover{filter:brightness(1.06)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}button.sm{padding:4px 12px;font-size:13px}
a{color:var(--pri);text-decoration:none}a:hover{text-decoration:underline}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;outline:0;transition:box-shadow .2s,border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}textarea{width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--pri)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.01em;background:color-mix(in srgb,currentColor 14%,transparent)}
.critical{color:var(--crit)}.high{color:var(--high)}.medium{color:var(--med)}.low{color:var(--low)}.info{color:var(--info)}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
@media(max-width:780px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;margin:0 0 10px}
.chipb{display:inline-block;background:var(--code);border-radius:99px;padding:2px 12px;font-size:12.5px}
.legend .lg{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;cursor:pointer;transition:background .2s;min-width:260px;font-variant-numeric:tabular-nums}
.legend .lg:hover{background:var(--code)}.legend .lg.on{background:color-mix(in srgb,currentColor 12%,transparent)}.legend .lg:active{transform:scale(.985)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .3s var(--ease),box-shadow .3s var(--ease);min-height:150px;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.tile:active{transform:scale(.985)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;margin-bottom:14px}
.tile b{font-size:17px;letter-spacing:-.01em}.tile .n{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:auto}
.home-h{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:8px 0 4px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;margin:10px 0}.bar{height:6px;background:var(--code);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:5px;transition:width .4s var(--ease)}
.tabs{display:flex;align-items:center;gap:10px;margin:26px 0 14px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.55);border:1px solid var(--bd);border-radius:11px;padding:3px}.seg div{padding:6px 16px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:500;transition:background .25s var(--ease),color .2s,box-shadow .25s}
.seg div.on{background:var(--card);color:var(--pri);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.lnk{font-size:13px;margin-left:12px}
.grp{margin:22px 4px 8px;font-weight:600;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:10px}.grid .f{margin:0}
.f{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin:8px 0;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.f:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.f:active{transform:scale(.995)}
.f .t{font-weight:600;letter-spacing:-.005em}.f small{color:var(--mut)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mut);font-weight:600;font-size:12px}tr:last-child td{border-bottom:0}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(650px,calc(100vw - 24px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:auto;padding:22px 26px;z-index:6;transform:translateX(calc(100% + 30px));visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
#drawer.open{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
pre{background:var(--code);padding:10px 12px;border-radius:12px;overflow:auto;margin:6px 0;white-space:pre-wrap;word-break:break-all}
.ctx{background:var(--code);border-radius:12px}.ctx div{white-space:pre;padding:0 10px}.ctx .hit{background:color-mix(in srgb,var(--high) 22%,transparent)}.ctx span{color:var(--mut);display:inline-block;width:38px}
.card.ctx{box-shadow:none}
.diff{background:var(--code);border-radius:12px;box-shadow:none}.diff .add{background:color-mix(in srgb,var(--ok) 22%,transparent)}.diff .del{background:color-mix(in srgb,var(--crit) 20%,transparent)}.diff div{white-space:pre-wrap;word-break:break-all}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px}.kv div:nth-child(odd){color:var(--mut)}
.chat .m{margin:6px 0;padding:10px 14px;border-radius:16px;background:var(--code);white-space:pre-wrap}.chat .m.dev{background:var(--pri-soft)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;place-items:center;z-index:9}
#modal>div{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;width:min(460px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.fld{margin:10px 0}.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.fld input{width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(40,40,42,.92);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 20px;border-radius:99px;display:none;z-index:20;max-width:80vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.warn{background:var(--pri-soft);border:1px solid color-mix(in srgb,var(--pri) 25%,transparent);padding:10px 14px;border-radius:12px;margin-top:10px;font-size:13px}
.foot,footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--bd);color:var(--mut);font-size:12.5px;text-align:center}
.pill.ok{background:var(--ok-soft)}.ok{color:var(--ok)}.bad{color:var(--crit)}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:14px;padding:10px 16px;min-width:92px;text-align:center;background:var(--code)}.chip b{display:block;font-size:24px;letter-spacing:-.02em}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}#drawer{transition:opacity .2s!important}}
@media(prefers-reduced-transparency:reduce){.top,#drawer,#modal,#toast{-webkit-backdrop-filter:none;backdrop-filter:none}.top,#drawer{background:var(--card)}}
</style>
</head>
<body>
<div class="top"><div>
  <span class="brand" id="brand" title="Home"><img class="logo" src="/assets/logo-128.png" alt="">Swiftec Security Center</span>
  <button class="pri" id="bScan">New Scan</button>
  <button id="bRescan">Rescan</button>
  <button id="bChanged">Changed Files</button>
  <button id="bHistory">History</button>
</div></div>
<div class="wrap">
  <div class="card" id="heroCard">
    <div class="hero">
      <div>
        <div class="mut" style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">Project</div>
        <h1 id="proj"></h1>
        <div class="row" style="gap:8px"><span class="chipb mono" id="branch"></span><span id="state" class="pill"></span></div>
        <div class="mut mono" id="rootPath" style="font-size:11.5px;margin-top:10px;word-break:break-all"></div>
        <div class="mut" style="margin-top:2px">Last scan: <span id="last"></span></div>
      </div>
      <div id="donut"></div>
    </div>
    <div id="prog" style="display:none;margin-top:20px">
      <b>Security Scan</b> <span class="mut" id="progCur"></span>
      <div class="steps" id="steps"></div>
      <div class="bar"><i id="barI" style="width:0"></i></div>
      <div class="mut" style="margin-top:4px">Progress: <span id="pct">0</span>%</div>
    </div>
    <div id="warns"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</div>

<div id="scrim"></div>
<div id="drawer"></div>
<div id="modal"><div id="modalBody"></div></div>
<div id="toast"></div>

<script>
'use strict';
const T = '__TOKEN__';
const SEV = ['critical', 'high', 'medium', 'low', 'info'];
const VAR = { critical: 'crit', medium: 'med' };
const SEVN = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low', info: 'Informational' };
const STATUS = { open: 'Open', reviewing: 'Reviewing', ai_fix_proposed: 'AI Fix Proposed', fix_applied: 'Fix Applied', manual_fix_applied: 'Manual Fix Applied', rescan_required: 'Rescan Required', resolved: 'Resolved', false_positive: 'False Positive', accepted_risk: 'Accepted Risk', ignored: 'Ignored' };
const KIND = { vulnerability: 'Security Vulnerability', risk: 'Security Risk', 'best-practice': 'Best Practice Warning', quality: 'Code Quality Issue', info: 'Informational Recommendation' };
const ACTIVE = ['open', 'reviewing', 'ai_fix_proposed', 'fix_applied', 'manual_fix_applied', 'rescan_required'];
const UNSUPPORTED = ['external', 'ai', 'history'];

const _rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...c) { return _rc.apply(this, c.flat().filter(x => x != null && x !== false)); };
const h = (t, a, ...c) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); } for (const x of c.flat()) { if (x == null || x === false) continue; e.append(x.nodeType ? x : document.createTextNode(String(x))); } return e; };
const $ = id => document.getElementById(id);
const api = (p, body) => fetch('/api/' + p, { method: body ? 'POST' : 'GET', headers: { 'x-secscan-token': T, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });
const toast = (m, bad) => { const t = $('toast'); t.textContent = m; t.style.background = bad ? 'rgba(200,30,30,.94)' : 'rgba(40,40,42,.92)'; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4500); };
const guard = (btn, fn) => async () => { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; } };
const pill = (s, cls) => h('span', { class: 'pill ' + (cls || s) }, s.toUpperCase ? s : s);
const fmtDate = d => d ? new Date(d).toLocaleString([], { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'never';
const ext = f => (f.file.match(/\.([\w]+)$/) || [, ''])[1] || '-';

let S = null, F = [], scans = [], tab = 'findings', filters = { sev: '', cat: '', st: 'active', scanner: '', lang: '', q: '', view: 'all' }, poll = null, openId = null;

async function load() {
  [S, F, scans] = await Promise.all([api('state'), api('findings'), api('scans')]);
  if (!load.once) tab = 'home'; load.once = true;
  renderHead(); renderView();
  if (S.state === 'Scanning' && !poll) startPoll();
}

function renderHead() {
  $('proj').textContent = S.project; document.title = S.project + ' — Swiftec Security Center'; $('rootPath').textContent = S.root; $('branch').textContent = '⎇ ' + S.branch; $('last').textContent = fmtDate(S.lastScan);
  const st = $('state'); st.textContent = S.state; st.title = S.staleFile ? 'Changed since last scan: ' + S.staleFile : ''; st.className = 'pill ' + ({ 'Scan Completed': 'ok', 'Scan Failed': 'critical', 'Rescan Required': 'medium', Scanning: 'low' }[S.state] || 'info');
  donut();
  $('heroCard').style.display = tab === 'home' && !poll ? 'none' : '';
  $('warns').replaceChildren(...(S.warnings || []).map(w => h('div', { class: 'warn' }, w)),
    !S.ai ? h('div', { class: 'mut', style: 'margin-top:8px;font-size:12px' }, 'AI features are off: install the claude CLI or set ANTHROPIC_API_KEY (SECSCAN_AI=claude-cli|anthropic-api).') : null);
  const dis = S.state === 'Scanning';
  ['bScan', 'bRescan', 'bChanged'].forEach(i => $(i).disabled = dis);
  $('bRescan').style.display = S.lastScan ? '' : 'none'; $('bRescan').textContent = S.lastOnly ? 'Rescan File' : 'Rescan'; $('bChanged').style.display = S.lastOnly ? 'none' : '';
  $('tabs').replaceChildren(h('div', { class: 'seg' }, ...[['home', 'Home'], ['new', 'New Scan'], ['findings', 'Findings'], ['deps', 'Dependencies'], ['scans', 'History']].map(([k, l]) => h('div', { class: tab === k || (tab === 'scan' && k === 'scans') ? 'on' : '', onclick: () => { tab = k; renderHead(); renderView(); } }, l))),
    h('span', { class: 'sp' }),
    ...['html', 'json', 'csv'].map(f => h('a', { href: `/api/export?fmt=${f}&token=${T}`, class: 'lnk', target: '_blank' }, f.toUpperCase())),
    h('a', { href: '#', class: 'lnk', onclick: async e => { e.preventDefault(); if (confirm('Treat all current open findings as the baseline? Future scans will highlight only new issues.')) { const r = await api('baseline', {}); toast(`Baseline set (${r.baseline})`); load(); } } }, 'Set baseline'));
}


function donut() {
  const NS = 'http://www.w3.org/2000/svg', el = $('donut'), cs = getComputedStyle(document.documentElement);
  const css = v => cs.getPropertyValue(v).trim(), col = k => css('--' + (VAR[k] || k));
  const total = SEV.reduce((a, k) => a + S.counts[k], 0), key = JSON.stringify(S.counts) + S.lastScan, animate = donut.key !== key && !matchMedia('(prefers-reduced-motion:reduce)').matches;
  donut.key = key;
  const R = 52, C = 2 * Math.PI * R, svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', 176); svg.setAttribute('height', 176); svg.setAttribute('viewBox', '0 0 140 140');
  const mk = (t, at) => { const n = document.createElementNS(NS, t); for (const [k, v] of Object.entries(at)) n.setAttribute(k, v); return n; };
  const ring = (stroke, len, off) => { const c = mk('circle', { cx: 70, cy: 70, r: R, fill: 'none', stroke, 'stroke-width': 13, transform: 'rotate(-90 70 70)', 'stroke-dashoffset': -off, 'stroke-dasharray': animate ? `0 ${C}` : `${len} ${C - len}` }); if (animate) { c.style.transition = 'stroke-dasharray .9s cubic-bezier(.32,.72,0,1)'; requestAnimationFrame(() => requestAnimationFrame(() => c.setAttribute('stroke-dasharray', `${len} ${C - len}`))); } return c; };
  svg.append(ring(css('--code'), C, 0));
  if (total) { let off = 0; const used = SEV.filter(k => S.counts[k]), gap = used.length > 1 ? 3 : 0;
    for (const k of used) { const d = S.counts[k] / total * C, c = ring(col(k), Math.max(d - gap, 1), off); c.append(Object.assign(document.createElementNS(NS, 'title'), { textContent: `${SEVN[k]}: ${S.counts[k]}` })); svg.append(c); off += d; } }
  const tx = (y, size, txt, fill, w) => { const t = mk('text', { x: 70, y, 'text-anchor': 'middle', 'font-size': size, 'font-weight': w || 400, fill, 'letter-spacing': size > 20 ? '-0.5' : '0' }); t.textContent = txt; return t; };
  svg.append(tx(S.lastScan ? 76 : 80, 34, S.lastScan ? total : '–', css('--fg'), 700));
  if (S.lastScan) svg.append(tx(93, 10.5, total === 1 ? 'open finding' : 'open findings', css('--mut')));
  const sc = S.score >= 85 ? 'var(--ok)' : S.score >= 70 ? 'var(--med)' : 'var(--crit)';
  const legend = h('div', { class: 'legend' },
    ...SEV.map(k => h('div', { class: 'lg ' + k + (filters.sev === k ? ' on' : ''), onclick: () => { filters.sev = filters.sev === k ? '' : k; tab = 'findings'; renderHead(); renderView(); } },
      h('span', { class: 'dot' }), h('span', { style: 'color:var(--fg);flex:1' }, SEVN[k]), h('b', { style: 'color:var(--fg)' }, S.counts[k]), h('span', { class: 'mut', style: 'width:38px;text-align:right' }, total ? Math.round(S.counts[k] / total * 100) + '%' : ''))),
    S.lastScan ? h('div', { class: 'row', style: 'margin:8px 12px 0;padding-top:10px;border-top:1px solid var(--bd);gap:6px' }, h('span', { class: 'mut' }, 'Security score'), h('b', { style: 'color:' + sc + ';font-size:17px' }, S.score), h('span', { class: 'mut' }, '/ 100'), h('span', { class: 'sp' }), S.accepted ? h('span', { class: 'mut' }, S.accepted + ' accepted') : null) : null);
  el.style.cssText = 'display:flex;gap:26px;align-items:center;flex-wrap:wrap';
  el.replaceChildren(svg, legend);
}

function startPoll() {
  $('prog').style.display = 'block';
  poll = setInterval(async () => {
    try {
      const p = await api('progress');
      $('steps').replaceChildren(...p.steps.map(s => h('div', {}, s.status === 'done' ? '[✓] ' : s.status === 'failed' ? '[!] ' : s.status === 'running' ? '[…] ' : '[ ] ', s.label)));
      $('barI').style.width = p.pct + '%'; $('pct').textContent = p.pct; $('progCur').textContent = p.current ? '· ' + p.current : '';
      if (p.state !== 'scanning') { clearInterval(poll); poll = null; if (p.state === 'failed') toast('Scan failed: ' + p.error, true); setTimeout(() => { $('prog').style.display = 'none'; load(); }, 800); }
    } catch (e) { clearInterval(poll); poll = null; }
  }, 600);
}
const opts = { gitHistory: false, ai: false };
async function doScan(mode) {
  active = true;
  await api('scan', S.lastOnly && mode === 'full' ? { only: S.lastOnly, label: S.lastOnly[0].startsWith('paste-') ? 'snippet' : 'file', ai: opts.ai } : { mode, gitHistory: opts.gitHistory, ai: opts.ai }); tab = 'findings';
  $('steps').replaceChildren(); $('barI').style.width = '0'; S.state = 'Scanning'; renderHead(); startPoll();
